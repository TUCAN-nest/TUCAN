name: CI
on: [push, workflow_dispatch, pull_request]

jobs:

  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: black
        run: black . --check --diff
      - name: mypy
        run: mypy tucan
      - name: pytest
        run: pytest
