[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tucan"
authors = [{ name = "Jan C. Brammer", email = "jan.brammer@pm.me" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dynamic = ["version"]

dependencies = ["networkx >=3.4", "scipy >=1.15.3"]

[project.optional-dependencies]
drawing = [
    "plotly",         # interactive 3D drawings
    "notebook",
    "ipywidgets",
    "matplotlib",
    "tabulate",
    "types-tabulate",
]
dev = ["pytest", "pytest-timeout", "syrupy", "mypy", "black"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = """
    -v
    --durations=5"""
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]

[tool.setuptools.dynamic]
version = { attr = "tucan.__version__" }
